<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>card-pair-scanner 開発ハーネス</title>
    <style>
      body { margin: 0; background: #111; color: #ddd; font-family: sans-serif; }
      #wrap { display: flex; flex-direction: column; gap: 8px; padding: 8px; }
      canvas { width: 100%; max-width: 960px; background: #000; }
      #controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      button { padding: 6px 12px; }
      #pairs { font-family: monospace; white-space: pre-wrap; }
      #stats { font-family: monospace; color: #8a8; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="controls">
        <button id="btn-engine" data-testid="harness-engine-toggle-button">engine: template</button>
        <button id="btn-pause" data-testid="harness-pause-button">pause</button>
        <span id="status" data-testid="harness-status-label"></span>
      </div>
      <canvas id="view" data-testid="harness-view-canvas"></canvas>
      <div id="stats" data-testid="harness-stats-label"></div>
      <div id="pairs" data-testid="harness-pairs-list"></div>
    </div>
    <script type="module" src="/src/harness-main.ts"></script>
  </body>
</html>
