# GitHub Pages 自動デプロイ(U3-NFR-6)
# リポジトリ設定: Settings → Pages → Source = "GitHub Actions" を選択すること
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # テスト(PBT含む39件)。失敗時はデプロイしない。fast-checkのシードはログに出力される(PBT-08)
      - run: npm test
      - run: npm run build
        env:
          VITE_AWS_RECOGNIZE_URL: ${{ vars.VITE_AWS_RECOGNIZE_URL }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
